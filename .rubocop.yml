plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'

Metrics/MethodLength:
  Max: 15

Naming/AccessorMethodName:
  Enabled: false

Naming/FileName:
  Exclude:
    - 'lib/hwf-dwp-api.rb'
    - 'lib/hwf-dwp-api/**/*'

Naming/PredicateMethod:
  Enabled: false

Style/ReturnNilInPredicateMethodDefinition:
  Enabled: false

RSpec/ExampleLength:
  Max: 16

RSpec/MultipleExpectations:
  Max: 4

RSpec/DescribeMethod:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Max: 8
